
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I'm Not a Robot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f5f5f5;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    #levelLabel {
      margin: 0 0 16px;
      color: #666;
    }

    iframe {
      display: block;
      width: min(400px, 100%);
      height: 540px;
      border: none;
      background: white;
    }

    #status {
      max-width: 400px;
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }

    #levelForm {
      position: fixed;
      bottom: 0;
      left: 0;
      margin: 0;
      padding: 0;
      z-index: 1000;
    }

    #levelInput {
      display: block;
      width: 24px;
      height: 24px;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
      border-radius: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 12px;
      opacity: 0;
      cursor: text;
    }

    #levelInput:focus {
      width: 150px;
      height: 36px;
      padding: 8px;
      border: 1px solid #aaa;
      border-radius: 6px;
      background: white;
      color: #222;
      caret-color: #222;
      opacity: 1;
    }
  </style>
</head>

<body>
  <h1>I'm Not a Robot</h1>

  <p id="levelLabel"></p>

  <form id="levelForm">
    <input
      id="levelInput"
      type="number"
      min="1"
      max="48"
      step="1"
      placeholder="Level"
      aria-label="Enter level number"
      autocomplete="off"
      required
    >
  </form>

  <iframe
    id="game"
    title="I'm Not a Robot CAPTCHA"
    width="400"
    height="540"
    scrolling="yes"
    src="https://embed.neal.fun/not-a-robot/1">
  </iframe>

  <p id="status" aria-live="polite"></p>

  <script>
    const FIRST_LEVEL = 1;
    const LAST_LEVEL = 48;
    const EXCLUDED_LEVELS = [45];

    const LEVEL_KEY = "nealRobotCurrentLevel";
    const COMPLETED_KEY = "nealRobotCompletedLevels";

    const game = document.getElementById("game");
    const levelLabel = document.getElementById("levelLabel");
    const levelForm = document.getElementById("levelForm");
    const levelInput = document.getElementById("levelInput");
    const status = document.getElementById("status");

    function isValidLevel(level) {
      return (
        Number.isInteger(level) &&
        level >= FIRST_LEVEL &&
        level <= LAST_LEVEL
      );
    }

    function loadSavedLevel() {
      const saved = Number(localStorage.getItem(LEVEL_KEY));

      if (!isValidLevel(saved)) {
        return FIRST_LEVEL;
      }

      return EXCLUDED_LEVELS.includes(saved)
        ? saved + 1
        : saved;
    }

    function loadCompletedLevels() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(COMPLETED_KEY) || "[]"
        );

        if (!Array.isArray(saved)) {
          return [];
        }

        return [...new Set(saved.filter(isValidLevel))];
      } catch {
        return [];
      }
    }

    let currentLevel = loadSavedLevel();
    let completedLevels = loadCompletedLevels();

    function saveProgress() {
      localStorage.setItem(
        LEVEL_KEY,
        String(currentLevel)
      );

      localStorage.setItem(
        COMPLETED_KEY,
        JSON.stringify(completedLevels)
      );
    }

    function renderLevel() {
      levelLabel.textContent =
        `Level ${currentLevel} of ${LAST_LEVEL}`;

      status.textContent = "";
      levelInput.value = "";

      saveProgress();

      game.src =
        `https://embed.neal.fun/not-a-robot/${currentLevel}`;
    }

    function advanceAfterVerification() {
      if (!completedLevels.includes(currentLevel)) {
        completedLevels.push(currentLevel);
      }

      if (currentLevel === LAST_LEVEL) {
        saveProgress();

        status.textContent =
          "Congratulations! You've completed the final level. " +
          "Enjoy the final screen and certificate in the game above.";

        return;
      }

      currentLevel += 1;

      while (
        currentLevel <= LAST_LEVEL &&
        EXCLUDED_LEVELS.includes(currentLevel)
      ) {
        currentLevel += 1;
      }

      if (currentLevel > LAST_LEVEL) {
        saveProgress();

        status.textContent =
          "Congratulations! You've completed all available levels.";

        return;
      }

      renderLevel();
    }

    levelForm.addEventListener("submit", event => {
      event.preventDefault();

      const requestedLevel = Number(levelInput.value);

      if (!isValidLevel(requestedLevel)) {
        status.textContent =
          "Please enter a whole number between 1 and 48.";
        return;
      }

      currentLevel = requestedLevel;
      renderLevel();
    });

    window.addEventListener("message", event => {
      if (event.origin !== "https://embed.neal.fun") {
        return;
      }

      if (event.source !== game.contentWindow) {
        return;
      }

      if (event.data?.type !== "captcha-completed") {
        return;
      }

      advanceAfterVerification();
    });

    renderLevel();
  </script>
</body>
</html>
